:root{--bg:#f4f6fa;--card:#fff;--tx:#0f1b33;--mu:#64708a;--nv:#052a58;--lm:#b3f50a;--bd:#dde3ee;--rd:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:8px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}.bar i{display:block;width:100%;background:#052a58;border-radius:6px 6px 0 0;min-height:2px}.bar.u i{background:#8fb800}
.login{max-width:400px;margin:30px auto}.login img{display:block;width:120px;margin:0 auto 10px;background:#fff;border-radius:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.kp b{display:block;font-size:19px;margin-top:4px}.ok{color:#2e7d32}

${CATS.filter(c=>fc==="all"||fc===c).map(c=>{const l=R.filter(p=>p.cat===c&&L(p)).sort((a,b)=>a.name.localeCompare(b.name));return`<div class="card"><div class="row"><b>🎒 ${esc(c)}</b><span class="mu">${l.reduce((s,p)=>s+p.stock,0)} unidades</span>${ad&&!R.some(p=>p.cat===c)?`<button class="g" style="flex:0 0 auto" onclick="delCat(this.dataset.c)" data-c="${esc(c)}">Eliminar bolsa vacía</button>`:""}</div><div class="w"><table><tr><th>Código</th><th>Producto</th><th>Stock</th><th>Precio</th>${ad?"<th></th>":""}</tr>${l.map(p=>ad?`<tr><td><input value="${esc(p.code||"")}" placeholder="SKU" style="width:100px" onchange="setF('${p.id}','code',this.value.trim())"></td><td><input value="${esc(p.name)}" style="min-width:160px" onchange="setF('${p.id}','name',this.value)"></td><td><button class="g" onclick="adj('${p.id}',-1)">−</button> <input type="number" min="0" value="${p.stock}" style="width:64px" onchange="setF('${p.id}','stock',Math.max(0,+this.value))"> <button class="g" onclick="adj('${p.id}',1)">+</button></td><td><input type="number" min="0" value="${p.price}" style="width:96px" onchange="setF('${p.id}','price',+this.value)"></td><td><button class="d" title="Eliminar" onclick="delP('${p.id}')">🗑</button></td></tr>`:`<tr><td>${esc(p.code||"—")}</td><td>${esc(p.name)}</td><td class="${p.stock<=3?"low":""}">${p.stock?p.stock:"Sin stock"}</td><td>${clp(p.price)}</td></tr>`).join("")||`<tr><td class="mu" colspan="4">Sin productos</td></tr>`}</table></div></div>`}).join("")}`}
async function addP(e){e.preventDefault();if(!isAdmin())return;const n=$("#na").value.trim(),code=$("#ncode").value.trim();if(!n)return;if(code&&P.some(p=>(p.code||"").toLowerCase()===code.toLowerCase()))return alert("Ese código/SKU ya existe.");await db.collection("products").doc("p"+Date.now()).set({code,name:n,cat:$("#nc").value,stock:+$("#ns").value,price:+$("#np").value,created:Date.now()});["#ncode","#na","#ns","#np"].forEach(x=>$(x).value="");$("#ncode").focus()}
function setF(id,f,v){if(!isAdmin())return;const priv=["cost","q0","inv"].includes(f);db.collection(priv?"productPrivate":"products").doc(id).set({[f]:v},{merge:true})}
async function adj(id,d){if(!isAdmin())return;const p=P.find(x=>x.id===id);if(p)setF(id,"stock",Math.max(0,p.stock+d))}
async function delP(id){if(!isAdmin())return;const p=P.find(x=>x.id===id);if(p&&confirm(`¿Eliminar "${p.name}" (${p.stock} en stock)?`)){await db.collection("products").doc(id).delete();try{await db.collection("productPrivate").doc(id).delete()}catch(e){}}}
function saveCats(l){if(!isAdmin())return;CATS=l;db.collection("meta").doc("cats").set({list:l})}
function addCat(){if(!isAdmin())return;const n=(prompt("Nombre de la nueva bolsa")||"").trim();if(n&&!CATS.includes(n))saveCats([...CATS,n])}
function delCat(c){if(!isAdmin())return;if(confirm(`¿Eliminar la bolsa "${c}"?`))saveCats(CATS.filter(x=>x!==c))}
function csv(name,rows){const data="\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n"),blob=new Blob([data],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function expInv(){csv("inventario_x3.csv",[["Bolsa","Código","Producto","Stock","Precio"],...P.filter(p=>isAdmin()||!p.inv).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name)).map(p=>[p.cat,p.code||"",p.name,p.stock,p.price])])}
function expVen(){if(!isAdmin())return alert("Solo los administradores pueden exportar ventas generales.");const l=S;csv("ventas_x3.csv",[["Fecha","Vendedor","Bolsa","Código","Producto","Cantidad","Precio lista","Precio venta","Desc %","Subtotal","Estado"],...l.flatMap(s=>s.items.map(i=>[new Date(s.ts).toLocaleString("es-CL"),s.seller,i.cat,i.code||"",i.name,i.q,i.list,i.pr,i.d,Math.round(i.q*i.pr*(1-i.d/100)),s.void?"Anulada":"OK"]))])}
async function anular(id){if(!isAdmin())return;const s=S.find(x=>x.id===id);if(!s||!confirm("¿Anular esta venta? El stock se devolverá al inventario."))return;try{await db.runTransaction(async tx=>{for(const i of s.items){if(!i.pid)continue;const ref=db.collection("products").doc(i.pid),snap=await tx.get(ref);if(snap.exists)tx.update(ref,{stock:(snap.data().stock||0)+i.q})}tx.update(db.collection("sales").doc(id),{void:true,voidBy:me.name,voidTs:Date.now()})})}catch(e){alert("No se pudo anular: "+e.message)}}


function jvH(id){if(!isAdmin())return"";const iv=INVS.find(v=>v.id===id)||{name:id},J=P.filter(p=>p.inv&&ivOf(p)===id),ids=new Set(J.map(p=>p.id)),now=Date.now(),sl=[];
S.filter(s=>!s.void).forEach(s=>s.items.forEach(i=>{if(ids.has(i.pid))sl.push({ts:s.ts,pid:i.pid,u:i.q,a:i.q*i.pr*(1-i.d/100),l:i.q*i.list})}));sl.sort((a,b)=>a.ts-b.ts);
const sum=(l,f)=>l.reduce((a,x)=>a+f(x),0),inv=sum(J,p=>p.q0*p.cost),ven=sum(sl,x=>x.a),uv=sum(sl,x=>x.u),st=sum(J,p=>p.stock),sv=sum(J,p=>p.stock*p.price);
const t0=sl.length?sl[0].ts:now,d=Math.max(1,(now-t0)/864e5),vu=uv/d,vr=ven/d,dl=vu>0?st/vu:null,rec=inv-ven,dr=rec<=0?0:(vr>0?rec/vr:null),fd=n=>n==null?"—":new Date(now+n*864e5).toLocaleDateString("es-CL"),fdays=n=>n==null?"sin ventas aún":n<=0?"—":Math.ceil(n)+" días";
const Lr=sum(sl,x=>x.l),f=Lr>0?ven/Lr:1,pv=ven+sv*f,util=pv-inv,cm={};J.forEach(p=>cm[p.id]=p.cost);const real=ven-sum(sl,x=>x.u*(cm[x.pid]||0)),al=new Set(AL().map(x=>x.p.id)),kp=(l,v,c)=>`<div>${l}<b class="${c||""}">${v}</b></div>`;
let wk=[];for(let k=7;k>=0;k--){const a=now-(k+1)*7*864e5,b=now-k*7*864e5;wk.push({u:sum(sl.filter(x=>x.ts>a&&x.ts<=b),x=>x.u),l:new Date(b).toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit"})})}
const wm=Math.max(1,...wk.map(x=>x.u));
return`<div class="row"><b style="font-size:18px">${esc(iv.name)}</b><button class="g" style="flex:0 0 auto" onclick="renInv('${id}')">Renombrar</button>${id!=="jv"?`<button class="d" style="flex:0 0 auto" onclick="delInv('${id}')">Eliminar inversión</button>`:""}</div><form class="card" onsubmit="addJ(event,'${id}')"><b>➕ Producto de «${esc(iv.name)}»</b><div class="row"><input id="jcode" placeholder="Código / SKU" style="flex:1 1 110px"><input id="ja" placeholder="Nombre" required style="flex:3 1 180px"><select id="jc">${CATS.map(c=>`<option>${esc(c)}</option>`).join("")}</select><input id="js" type="number" min="1" placeholder="Cantidad" required><input id="jk" type="number" min="0" placeholder="Costo unitario $" required><input id="jp" type="number" min="0" placeholder="Precio venta $" required><button class="lm">Agregar</button></div><span class="mu">Estos productos se venden normalmente (aparecen con ★JV) y se miden aquí por separado.</span></form>
<div class="kp">${kp("💰 Monto invertido",clp(inv))}${kp("Vendido acumulado",clp(ven))}${kp("Descuentos otorgados",clp(Lr-ven)+" ("+Math.round((1-f)*100)+"%)")}${kp("Recuperado",inv?Math.round(ven/inv*100)+"%":"—",rec<=0&&inv?"ok":"")}${kp("Unidades vendidas / en stock",uv+" / "+st)}${kp("Stock a precio lista",clp(sv))}${kp("Stock estimado con descuentos",clp(sv*f))}${kp("Total proyectado (lista)",clp(ven+sv))}${kp("📈 Total proyectado real",clp(pv))}${kp("Utilidad realizada hoy",clp(real),real>=0?"ok":"low")}${kp("Utilidad proyectada real",clp(util),util>=0?"ok":"low")}${kp("Velocidad de venta",vu.toFixed(2)+" un/día")}${kp("Stock se agota en",fdays(dl)+(dl?" · "+fd(dl):""))}${kp("Recupera inversión en",rec<=0&&inv?"✅ ya recuperada":fdays(dr)+(dr?" · "+fd(dr):""))}</div>
<div class="mu" style="margin:-6px 0 12px">La proyección real aplica al stock restante el descuento promedio que ya se ha dado en las ventas de esta inversión.</div>
<div class="card"><b>Venta acumulada vs. inversión</b><div class="mu">Línea azul: vendido · roja: inversión · punteada: proyección (con descuentos promedio) a velocidad actual hasta vender todo el stock. 🐌 = sin ventas hace más de 15 días</div>${jvChart(sl,inv,ven,sv*f,t0,now,dl)}</div>
<div class="card"><b>Velocidad: unidades vendidas por semana</b><div class="bars">${wk.map(x=>`<div class="bar u">${x.u||""}<i style="height:${x.u/wm*130}px"></i>${x.l}</div>`).join("")}</div></div>
<div class="card w"><table><tr><th>Código</th><th>Producto</th><th>Costo</th><th>Precio</th><th>Stock</th><th>Invertido</th><th>Vendidas</th><th>Vendido $</th><th>Un/día</th><th>Se agota</th><th></th></tr>${J.map(p=>{const m=sl.filter(x=>x.pid===p.id),u=sum(m,x=>x.u),v=u/d;return`<tr><td><input value="${esc(p.code||"")}" placeholder="SKU" style="width:100px" onchange="setF('${p.id}','code',this.value.trim())"></td><td>${al.has(p.id)?"🐌 ":""}${esc(p.name)} <span class="mu">${esc(p.cat)}</span></td><td><input type="number" min="0" value="${p.cost}" style="width:90px" onchange="setF('${p.id}','cost',+this.value)"></td><td><input type="number" min="0" value="${p.price}" style="width:90px" onchange="setF('${p.id}','price',+this.value)"></td><td><input type="number" min="0" value="${p.stock}" style="width:64px" onchange="setF('${p.id}','stock',Math.max(0,+this.value))"></td><td>${clp(p.q0*p.cost)}</td><td>${u} <span class="mu">de ${p.q0}</span></td><td>${clp(sum(m,x=>x.a))}</td><td>${v.toFixed(2)}</td><td>${p.stock?(u?fdays(p.stock/v):"—"):"Agotado"}</td><td><button class="g" onclick="repo('${p.id}')">+ Reponer</button> <button class="d" onclick="delP('${p.id}')">🗑</button></td></tr>`}).join("")||`<tr><td class="mu">Aún no hay productos de la inversión</td></tr>`}</table></div>`}
function jvChart(sl,inv,ven,sv,t0,now,dl){if(!sl.length)return`<p class="mu">Aún no hay ventas de estos productos.</p>`;
const end=dl!=null?now+dl*864e5:now,ym=Math.max(inv,ven+sv)*1.08||1,X=t=>40+(t-t0)/Math.max(1,end-t0)*540,Y=v=>180-v/ym*160,f=t=>new Date(t).toLocaleDateString("es-CL");
let c=0,pts=`${X(t0)},${Y(0)}`;sl.forEach(x=>{pts+=` ${X(x.ts)},${Y(c)}`;c+=x.a;pts+=` ${X(x.ts)},${Y(c)}`});pts+=` ${X(now)},${Y(c)}`;
return`<div class="w"><svg viewBox="0 0 600 205" style="width:100%;min-width:480px;font-size:10px;fill:var(--mu)"><line x1="40" x2="580" y1="${Y(inv)}" y2="${Y(inv)}" style="stroke:var(--rd);stroke-dasharray:5 4"/><text x="42" y="${Y(inv)-4}">Inversión ${clp(inv)}</text><line x1="40" x2="580" y1="180" y2="180" style="stroke:var(--bd)"/><polyline points="${pts}" style="fill:none;stroke:var(--nv);stroke-width:2.5"/>${dl!=null?`<line x1="${X(now)}" y1="${Y(ven)}" x2="${X(end)}" y2="${Y(ven+sv)}" style="stroke:#8fb800;stroke-width:2.5;stroke-dasharray:3 4"/>`:""}<text x="40" y="198">${f(t0)}</text><text x="580" y="198" text-anchor="end">${f(end)}</text></svg></div>`}
async function addJ(e,id){e.preventDefault();if(!isAdmin())return;const n=$("#ja").value.trim(),code=$("#jcode").value.trim(),q=+$("#js").value;if(!n||!q)return;if(code&&P.some(p=>(p.code||"").toLowerCase()===code.toLowerCase()))return alert("Ese código/SKU ya existe.");const pid="p"+Date.now(),batch=db.batch();batch.set(db.collection("products").doc(pid),{code,name:n,cat:$("#jc").value,stock:q,price:+$("#jp").value,created:Date.now()});batch.set(db.collection("productPrivate").doc(pid),{q0:q,cost:+$("#jk").value,inv:id});await batch.commit();["#jcode","#ja","#js","#jk","#jp"].forEach(x=>$(x).value="");$("#jcode").focus()}
async function repo(id){if(!isAdmin())return;const p=P.find(x=>x.id===id),n=parseInt(prompt("¿Cuántas unidades se agregan a la inversión?"));if(p&&n>0){const batch=db.batch();batch.update(db.collection("products").doc(id),{stock:p.stock+n});batch.set(db.collection("productPrivate").doc(id),{q0:(p.q0||0)+n},{merge:true});await batch.commit()}}

function AL(){const now=Date.now(),last={};S.forEach(s=>{if(!s.void)s.items.forEach(i=>{if(i.pid&&s.ts>(last[i.pid]||0))last[i.pid]=s.ts})});return P.filter(p=>p.stock>0).map(p=>{const c=p.created||+String(p.id).slice(1)||now;return{p,ls:last[p.id]||0,d:Math.floor((now-Math.max(last[p.id]||0,c))/864e5)}}).filter(x=>x.d>15).sort((a,b)=>b.d-a.d)}
function alH(){if(!isAdmin())return"";const L=AL(),cap=L.reduce((a,x)=>a+x.p.stock*(x.p.cost||x.p.price),0);return`<div class="card"><b>⚠️ Productos con stock sin ventas hace más de 15 días</b><div class="mu">Incluye el inventario general y todas las inversiones. Los días se cuentan desde la última venta, o desde que se agregó el producto si nunca se ha vendido. Capital detenido: <b>${clp(cap)}</b></div></div><div class="card w"><table><tr><th>Producto</th><th>Origen</th><th>Stock</th><th>Capital detenido</th><th>Sin ventas</th><th>Última venta</th></tr>${L.map(x=>`<tr><td>${esc(x.p.name)}</td><td>${x.p.inv?esc((INVS.find(v=>v.id===ivOf(x.p))||{name:"Inversión"}).name):"Inventario · "+esc(x.p.cat)}</td><td>${x.p.stock}</td><td>${clp(x.p.stock*(x.p.cost||x.p.price))}</td><td class="${x.d>30?"low":""}">${x.d} días</td><td>${x.ls?new Date(x.ls).toLocaleDateString("es-CL"):"Nunca vendido"}</td></tr>`).join("")||`<tr><td class="mu">✅ Todos los productos con stock han tenido ventas en los últimos 15 días</td></tr>`}</table></div>`}
function addInv(){if(!isAdmin())return;const n=(prompt("Nombre de la nueva inversión")||"").trim();if(!n)return;const id="i"+Date.now();db.collection("invs").doc(id).set({name:n,ts:Date.now()});tab="inv:"+id}
function renInv(id){if(!isAdmin())return;const v=INVS.find(x=>x.id===id),n=(prompt("Nuevo nombre",v.name)||"").trim();if(n)db.collection("invs").doc(id).set({name:n,ts:Date.now()})}
function delInv(id){if(!isAdmin())return;if(P.some(p=>p.inv&&ivOf(p)===id))return alert("Primero elimina o mueve los productos de esta inversión.");if(confirm("¿Eliminar esta inversión?")){db.collection("invs").doc(id).delete();tab="venta"}}
function ventaH(){const tot=cart.reduce((s,i)=>s+i.q*i.pr*(1-i.d/100),0);return`<div class="card"><b>Registrar venta</b><div class="row"><select id="sp"><option value="">Producto…</option>${P.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${p.code?esc(p.code)+" · ":""}${esc(p.name)} (${esc(p.cat)}${isAdmin()&&p.inv?" · inversión":""} · stock ${p.stock})</option>`).join("")}</select><button class="lm" style="flex:0 0 auto" onclick="addC()">Agregar</button></div>
<div class="w"><table><tr><th>Código</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>Desc. %</th><th>Subtotal</th><th></th></tr>${cart.map((i,k)=>`<tr><td>${esc(i.code||"—")}</td><td>${esc(i.name)}</td><td><input type="number" min="1" max="${i.max}" value="${i.q}" style="width:70px" onchange="cart[${k}].q=Math.min(${i.max},Math.max(1,+this.value||1));render()"></td><td><input type="number" min="0" value="${i.pr}" style="width:100px" onchange="cart[${k}].pr=+this.value;render()"></td><td><input type="number" min="0" max="100" value="${i.d}" style="width:70px" onchange="cart[${k}].d=Math.min(100,+this.value||0);render()"></td><td>${clp(i.q*i.pr*(1-i.d/100))}</td><td><button class="d" onclick="cart.splice(${k},1);render()">✕</button></td></tr>`).join("")||`<tr><td class="mu">Carrito vacío</td></tr>`}</table></div>
<div class="row"><b style="font-size:20px">Total: ${clp(tot)}</b><button class="lm" ${cart.length?"":"disabled"} onclick="sell()">Confirmar venta</button></div><div class="err">${esc(err)}</div></div>`}
function addC(){const p=P.find(x=>x.id===$("#sp").value);if(!p)return;const c=cart.find(i=>i.id===p.id);if(c)c.q=Math.min(c.max,c.q+1);else cart.push({id:p.id,code:p.code||"",name:p.name,cat:p.cat,q:1,max:p.stock,pr:p.price,list:p.price,d:0});render()}
async function sell(){err="";if(!cart.length)return;try{const saleId="s"+Date.now(),saleRef=db.collection("sales").doc(saleId),items=cart.map(i=>({pid:i.id,code:i.code||"",name:i.name,cat:i.cat,q:i.q,pr:i.pr,list:i.list,d:i.d})),total=cart.reduce((s,i)=>s+i.q*i.pr*(1-i.d/100),0);await db.runTransaction(async tx=>{for(const i of cart){const ref=db.collection("products").doc(i.id),snap=await tx.get(ref);if(!snap.exists||snap.data().stock<i.q)throw new Error(`Stock insuficiente de ${i.name}`);tx.update(ref,{stock:snap.data().stock-i.q})}tx.set(saleRef,{ts:Date.now(),seller:me.name,sid:me.id,items,total})});cart=[]}catch(x){err=x.message||"Error al registrar"}render()}
function ventasH(){if(!isAdmin())return"";const l=S;return`<div class="row"><button class="g" style="flex:0 0 auto" onclick="expVen()">⬇ Excel</button></div><div class="card w"><table><tr><th>Fecha</th><th>Vendedor</th><th>Detalle</th><th>Total</th>${isAdmin()?"<th></th>":""}</tr>${l.map(s=>`<tr style="${s.void?"opacity:.5;text-decoration:line-through":""}"><td>${new Date(s.ts).toLocaleString("es-CL")}</td><td>${esc(s.seller)}</td><td style="white-space:normal">${s.items.map(i=>`${i.q}× ${i.code?esc(i.code)+" · ":""}${esc(i.name)}${i.pr!==i.list||i.d?` <span class="mu">(lista ${clp(i.list)}${i.d?`, -${i.d}%`:""})</span>`:""}`).join("; ")}</td><td>${clp(s.total)}</td>${isAdmin()?`<td>${s.void?"Anulada":`<button class="g" onclick="anular('${s.id}')">Anular</button>`}</td>`:""}</tr>`).join("")||`<tr><td class="mu">Sin ventas</td></tr>`}</table></div>`}
function grafH(){if(!isAdmin())return"";const m=MES.map(()=>({t:0,u:0}));S.filter(s=>!s.void&&new Date(s.ts).getFullYear()===yr).forEach(s=>{const k=new Date(s.ts).getMonth();m[k].t+=s.total;m[k].u+=s.items.reduce((a,i)=>a+i.q,0)});
const mt=Math.max(1,...m.map(x=>x.t)),mu=Math.max(1,...m.map(x=>x.u)),bars=(k,mx,f,c)=>`<div class="bars">${m.map((x,i)=>`<div class="bar ${c}">${f(x[k])}<i style="height:${x[k]/mx*130}px"></i>${MES[i]}</div>`).join("")}</div>`;
const cat=CATS.map(c=>[c,S.filter(s=>!s.void&&new Date(s.ts).getFullYear()===yr).reduce((a,s)=>a+s.items.filter(i=>i.cat===c).reduce((b,i)=>b+i.q*i.pr*(1-i.d/100),0),0)]);
return`<div class="row"><b>Año</b><select onchange="yr=+this.value;render()">${[yr+1,yr,yr-1,yr-2].filter((v,i,a)=>a.indexOf(v)===i).map(y=>`<option ${y===yr?"selected":""}>${y}</option>`).join("")}</select><b style="flex:3">Total año: ${clp(m.reduce((a,x)=>a+x.t,0))}</b></div>
<div class="card"><b>Ventas por mes ($)</b>${bars("t",mt,v=>v?clp(v).replace(/,/g,""):"","")}</div><div class="card"><b>Unidades vendidas por mes</b>${bars("u",mu,v=>v||"","u")}</div>
<div class="card"><b>Por bolsa (año)</b>${cat.map(([c,v])=>`<div class="row"><span>${c}</span><span>${clp(v)}</span></div>`).join("")}</div>`}
function usrH(){if(!isAdmin())return"";return`<div class="card w"><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th></th></tr>${U.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.role==="vendedor"?`<button class="d" onclick="if(confirm('¿Quitar vendedor?'))db.collection('users').doc('${u.id}').delete()">Quitar</button>`:""}</td></tr>`).join("")}</table></div>`}
